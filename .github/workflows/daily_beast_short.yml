name: 24/7 Viral MrBeast Shorts Automation (3x Daily)

on:
  schedule:
    # Runs 3 times a day: 02:00, 10:00, 18:00 UTC (every 8 hours)
    - cron: '0 2,10,18 * * *'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
            persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cut Viral MrBeast Short & Publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_PRIVACY: ${{ secrets.VIDEO_PRIVACY || 'public' }}
        run: |
          python run_pipeline.py

      - name: Commit and Push History
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json || true
          git commit -m "chore: record clipped video segment to prevent duplicates [skip ci]" || true
          git push || true

      - name: Upload Video Artifact (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-beast-short
          path: output/*.mp4
          retention-days: 7
