name: 24/7 Viral MrBeast Shorts Automation (6x Daily Randomized)

on:
  schedule:
    # 6 times a day: 00:15, 04:15, 08:15, 12:15, 16:15, 20:15 UTC
    - cron: '15 0,4,8,12,16,20 * * *'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  clip-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation libass9

      - name: Install Python & Node Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install

      - name: Natural Random Upload Timing Delay
        if: github.event_name == 'schedule'
        run: |
          # Jitter sleep between 60 and 1800 seconds (1-30 minutes) for organic upload timestamps
          JITTER_SEC=$(( (RANDOM % 1740) + 60 ))
          echo "Natural timing jitter: sleeping for ${JITTER_SEC} seconds..."
          sleep ${JITTER_SEC}

      - name: Cut Transformative MrBeast Short & Publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_PRIVACY: ${{ secrets.VIDEO_PRIVACY || 'public' }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python run_pipeline.py

      - name: Commit and Push History
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json || true
          git commit -m "chore: record clipped video segment to prevent duplicates [skip ci]" || true
          git push || true

      - name: Upload Video Artifact (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-beast-short
          path: output/*.mp4
          retention-days: 7
